<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="AI Viva plugin icon">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0082CA"/>

  <!-- Mortarboard / graduation cap -->
  <polygon points="50,18 82,33 50,48 18,33" fill="#fff" opacity="0.95"/>
  <rect x="72" y="33" width="3" height="18" rx="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="73.5" cy="53" r="4" fill="#FFD700"/>

  <!-- Speech bubble (AI dialogue) -->
  <rect x="24" y="55" width="40" height="24" rx="8" fill="#fff" opacity="0.9"/>
  <polygon points="34,79 28,88 42,79" fill="#fff" opacity="0.9"/>

  <!-- Waveform inside bubble -->
  <line x1="30" y1="67" x2="30" y2="73" stroke="#0082CA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="63" x2="36" y2="77" stroke="#0082CA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="65" x2="42" y2="75" stroke="#0082CA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="61" x2="48" y2="79" stroke="#0082CA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="64" x2="54" y2="76" stroke="#0082CA" stroke-width="2.5" stroke-linecap="round"/>

  <!-- AI sparkle -->
  <circle cx="74" cy="68" r="10" fill="#FFD700" opacity="0.9"/>
  <text x="74" y="72.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#0082CA" font-family="sans-serif">AI</text>
</svg>
