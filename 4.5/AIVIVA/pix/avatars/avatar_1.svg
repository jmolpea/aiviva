<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Neutral academic avatar">
  <!-- Avatar 1: Neutral/androgynous, formal suit, serious but approachable -->
  <defs>
    <clipPath id="circle-clip-1">
      <circle cx="100" cy="100" r="98"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="98" fill="#1a3a5c" class="avatar-glow"/>

  <!-- Body / suit -->
  <ellipse cx="100" cy="175" rx="70" ry="50" fill="#2c3e50" clip-path="url(#circle-clip-1)"/>
  <!-- Shirt collar / tie -->
  <polygon points="95,130 105,130 110,165 90,165" fill="#ecf0f1"/>
  <polygon points="97,130 103,130 102,155 98,155" fill="#2980b9"/>

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="18" rx="8" fill="#c8976a"/>

  <!-- Head -->
  <ellipse cx="100" cy="95" rx="38" ry="44" fill="#c8976a"/>

  <!-- Hair — short, neutral style -->
  <ellipse cx="100" cy="56" rx="38" ry="18" fill="#4a3728"/>
  <rect x="62" y="56" width="76" height="14" fill="#4a3728" rx="6"/>

  <!-- Eyes -->
  <ellipse cx="85" cy="92" rx="6" ry="7" fill="#fff"/>
  <ellipse cx="115" cy="92" rx="6" ry="7" fill="#fff"/>
  <circle cx="86" cy="93" r="4" fill="#3d2b1f"/>
  <circle cx="116" cy="93" r="4" fill="#3d2b1f"/>
  <!-- Pupils shine -->
  <circle cx="88" cy="91" r="1.5" fill="#fff"/>
  <circle cx="118" cy="91" r="1.5" fill="#fff"/>

  <!-- Eyebrows -->
  <path d="M78 84 Q85 80 92 84" stroke="#4a3728" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M108 84 Q115 80 122 84" stroke="#4a3728" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M98 100 Q100 108 102 100" stroke="#b07d56" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Mouth (neutral, slight smile) -->
  <ellipse id="mouth_open_1" cx="100" cy="119" rx="11" ry="0" fill="#2a0a00"/>
  <path class="mouth" d="M88 116 Q100 122 112 116" stroke="#8b5e3c" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Glasses -->
  <rect x="78" y="86" width="18" height="13" rx="5" fill="none" stroke="#555" stroke-width="2"/>
  <rect x="103" y="86" width="18" height="13" rx="5" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="96" y1="92" x2="103" y2="92" stroke="#555" stroke-width="1.5"/>

  <!-- Subtle outer ring for glow effect -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
</svg>
